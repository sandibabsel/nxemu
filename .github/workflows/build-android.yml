name: Build NxEmu Android APK

on:
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual
  push:
    branches: [ "master" ]

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode sumber beserta semua submodule (SANGAT PENTING untuk emulator)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Siapkan Java JDK 17 (Sesuai syarat NxEmu)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Siapkan Android SDK & NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. (Opsional) Terapkan patch konversi tipe data agar build lebih stabil di compiler baru
      - name: Apply texture_pass.cpp patch
        run: |
          sed -i 's/inst->Arg(1).U32() \* sizeof(u32)/inst->Arg(1).U32() * (u32)sizeof(u32)/g' src/yuzu_shader_recompiler/ir_opt/texture_pass.cpp || true

      # 5. Jalankan skrip build Android bawaan NxEmu
      - name: Build Android APK
        run: |
          chmod +x src/script/build_android.sh
          sh src/script/build_android.sh Release

      # 6. Unggah hasil APK sebagai Artifact agar bisa diunduh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxEmu-Android-Release-APK
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
