name: Build NxEmu Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode sumber beserta semua submodule
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Siapkan Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Siapkan Android SDK, NDK, dan Dependensi Sistem
      - name: Setup Android SDK & NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.16248370" "platforms;android-36" "build-tools;35.0.0"

      # 4. Terapkan patch konversi tipe data
      - name: Apply texture_pass.cpp patch
        run: |
          sed -i 's/inst->Arg(1).U32() \* sizeof(u32)/inst->Arg(1).U32() * (u32)sizeof(u32)/g' src/yuzu_shader_recompiler/ir_opt/texture_pass.cpp || true

      # 5. Jalankan skrip build Android
      - name: Build Android APK
        run: |
          chmod +x src/script/build_android.sh
          sh src/script/build_android.sh Release

      # 6. LANGKAH DEBUG: Cari file APK di seluruh direktori kerja
      - name: Debug: Find generated APKs
        run: |
          echo "--- Mencari semua file APK di workspace ---"
          find . -name "*.apk" -type f || true
          echo "--- Memeriksa direktori output Gradle ---"
          ls -laR src/android/app/build/outputs/apk/ || echo "Direktori tidak ditemukan"

      # 7. Unggah hasil APK sebagai Artifact (dengan pola pencarian yang lebih luas)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxEmu-Android-Release-APK
          path: |
            src/android/app/build/outputs/apk/**/*.apk
            build/android/**/*.apk
          if-no-files-found: error
